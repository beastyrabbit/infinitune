name: Build & Push Container Image

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  workflow_dispatch:

enable-openid-connect: true

env:
  REGISTRY: git.heerlab.com
  IMAGE_NAME: beasty/infinitune
  INFISICAL_API_URL: ${{ vars.INFISICAL_API_URL }}
  INFISICAL_ENV: ${{ vars.INFISICAL_ENV }}
  INFISICAL_MACHINE_IDENTITY_ID: ${{ vars.INFISICAL_MACHINE_IDENTITY_ID }}
  FJ_CI_INFISICAL_PROJECT_ID: ${{ vars.FJ_CI_INFISICAL_PROJECT_ID }}
  FJ_REGISTRY_SECRET_PATH: ${{ vars.FJ_REGISTRY_SECRET_PATH }}

jobs:
  quality:
    name: Lint, typecheck & test
    runs-on: personal
    defaults:
      run:
        shell: bash
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable corepack (pnpm)
        run: corepack enable && corepack prepare pnpm@10.28.2 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint & format check
        run: pnpm check

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

  build:
    needs: quality
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: personal
    defaults:
      run:
        shell: bash
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Docker CLI
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl docker.io
          docker --version

      - name: Install Infisical CLI
        run: |
          set -euo pipefail
          npm install --global @infisical/cli@0.43.91
          infisical --version

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver: remote
          endpoint: tcp://buildkitd.forgejo-runners.svc.cluster.local:1234

      - name: Login to Forgejo Container Registry
        run: |
          set -euo pipefail
          : "${INFISICAL_API_URL:?Missing INFISICAL_API_URL Forgejo variable}"
          : "${INFISICAL_ENV:?Missing INFISICAL_ENV Forgejo variable}"
          : "${INFISICAL_MACHINE_IDENTITY_ID:?Missing INFISICAL_MACHINE_IDENTITY_ID Forgejo variable}"
          : "${FJ_CI_INFISICAL_PROJECT_ID:?Missing FJ_CI_INFISICAL_PROJECT_ID Forgejo variable}"
          : "${FJ_REGISTRY_SECRET_PATH:?Missing FJ_REGISTRY_SECRET_PATH Forgejo variable}"
          : "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:?Missing Forgejo OIDC request token}"
          : "${ACTIONS_ID_TOKEN_REQUEST_URL:?Missing Forgejo OIDC request URL}"

          oidc_response="$(curl -fsS \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=https://git.heerlab.com/beasty")"
          forgejo_jwt="$(node -e 'const fs = require("fs"); const body = JSON.parse(fs.readFileSync(0, "utf8")); process.stdout.write(body.value || "");' <<< "$oidc_response")"
          : "${forgejo_jwt:?Forgejo OIDC response did not include a token}"

          infisical_token="$(infisical login \
            --method oidc-auth \
            --machine-identity-id "$INFISICAL_MACHINE_IDENTITY_ID" \
            --jwt "$forgejo_jwt" \
            --domain "$INFISICAL_API_URL" \
            --plain \
            --silent)"
          : "${infisical_token:?Infisical OIDC login returned an empty token}"
          echo "::add-mask::$infisical_token"

          package_token="$(infisical secrets get FORGEJO_PACKAGE_TOKEN \
            --domain "$INFISICAL_API_URL" \
            --token "$infisical_token" \
            --projectId "$FJ_CI_INFISICAL_PROJECT_ID" \
            --env "$INFISICAL_ENV" \
            --path "$FJ_REGISTRY_SECRET_PATH" \
            --plain \
            --silent)"
          : "${package_token:?Missing FORGEJO_PACKAGE_TOKEN in Forgejo CI Infisical project}"
          echo "::add-mask::$package_token"
          printf '%s' "$package_token" | docker login "$REGISTRY" --username beasty --password-stdin

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Output image digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: echo "Image pushed with digest $DIGEST" >> "$GITHUB_STEP_SUMMARY"
